<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Point your camera at the printed image and watch it come to life." />
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="Vivid AR" />
    <meta property="og:description" content="Point your camera at the printed image and watch it come to life." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Vivid AR</title>
  </head>
  <body>
    <main id="app">
      <div id="stage" class="stage" aria-hidden="true"></div>

      <section id="intro" class="screen" hidden>
        <div class="card">
          <div class="mark" aria-hidden="true"></div>
          <h1 id="introTitle">Bring the photo to life</h1>
          <p>Point your camera at the printed image.</p>
          <button id="startButton" class="button primary" type="button">Start camera</button>
          <p class="fine">Your camera feed stays on your device.</p>
        </div>
      </section>

      <section id="status" class="screen" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p id="statusText">Loading…</p>
      </section>

      <section id="error" class="screen" role="alert" hidden>
        <div class="card">
          <h1 id="errorTitle">Something went wrong</h1>
          <p id="errorText"></p>
          <button id="retryButton" class="button primary" type="button">Try again</button>
        </div>
      </section>

      <div id="scanHint" class="scan-hint" hidden>
        <div class="scan-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <p class="pill">Point at the image</p>
      </div>

      <button id="soundButton" class="pill sound" type="button" hidden aria-pressed="false">Tap for sound</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
